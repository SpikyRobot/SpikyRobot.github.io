<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ishaan Sen Pandey</title>
  <meta name="description" content="Ishaan Sen Pandey — personal site." />
  <meta name="theme-color" content="#000000" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&display=swap" rel="stylesheet" />

  <style>
    /* ============================================================
       EDIT ME: name, tagline and social URLs live in the <main>
       section below. Everything else is styling.
       ============================================================ */

    :root {
      --bg: #000;
      --text: #f5f5f7;
      --muted: rgba(245, 245, 247, 0.48);
      --hairline: rgba(255, 255, 255, 0.12);
      --chrome: linear-gradient(
        100deg,
        #6e6e73 0%,
        #d2d2d7 18%,
        #ffffff 28%,
        #8e8e93 40%,
        #f5f5f7 55%,
        #5a5a5f 68%,
        #e8e8ed 82%,
        #8e8e93 100%
      );
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow: hidden;
    }

    /* Starfield */
    #stars {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Soft light that follows the cursor, like a highlight on metal */
    .spotlight {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(
        140px circle at var(--mx, -500px) var(--my, -500px),
        rgba(255, 255, 255, 0.07),
        transparent 70%
      );
      transition: background 0.2s linear;
    }

    /* Vignette to keep the edges deep black */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
    }

    main {
      position: relative;
      z-index: 2;
      min-height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 16px;
      gap: 28px;
    }

    .name {
      font-size: clamp(2.25rem, 8vw, 6.5rem);
      font-weight: 300;
      letter-spacing: -0.045em;
      line-height: 1;
      background: var(--chrome);
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation:
        rise 1.6s var(--ease) both,
        sheen 9s ease-in-out 1.2s infinite;
      filter: drop-shadow(0 0 40px rgba(255, 255, 255, 0.08));
    }

    .tagline {
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      font-weight: 400;
      color: var(--muted);
      letter-spacing: 0.01em;
      animation: rise 1.6s var(--ease) 0.25s both;
    }

    .socials {
      display: flex;
      gap: 14px;
      margin-top: 12px;
      list-style: none;
      animation: rise 1.6s var(--ease) 0.45s both;
    }

    .socials a {
      position: relative;
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      color: rgba(245, 245, 247, 0.7);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--hairline);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition:
        color 0.4s var(--ease),
        border-color 0.4s var(--ease),
        background 0.4s var(--ease),
        transform 0.4s var(--ease),
        box-shadow 0.4s var(--ease);
    }

    .socials a:hover,
    .socials a:focus-visible {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(255, 255, 255, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      outline: none;
    }

    .socials svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Tooltip label */
    .socials a::after {
      content: attr(aria-label);
      position: absolute;
      top: calc(100% + 12px);
      left: 50%;
      transform: translate(-50%, -4px);
      font-size: 0.75rem;
      color: var(--muted);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s var(--ease), transform 0.3s var(--ease);
    }
    .socials a:hover::after,
    .socials a:focus-visible::after {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    footer {
      position: fixed;
      bottom: 24px;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(245, 245, 247, 0.28);
      letter-spacing: 0.02em;
      animation: fade 2s var(--ease) 0.8s both;
    }

    /* Wireframe orbit sphere */
    #orb {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
      animation: fade 3s var(--ease) 0.3s both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); filter: blur(8px); }
      to   { opacity: 1; transform: none; filter: blur(0); }
    }

    @keyframes fade {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Slow light sweep across the chrome name */
    @keyframes sheen {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="spotlight" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <canvas id="orb" aria-hidden="true"></canvas>
  <main>
    <h1 class="name">Ishaan Sen Pandey</h1>
    <p class="tagline">Projects, ideas, and things I'm into. More soon.</p>

    <ul class="socials">
      <li>
        
        <a href="https://www.instagram.com/ishaan.sp/" target="_blank" rel="noopener" aria-label="Instagram">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5" />
            <circle cx="12" cy="12" r="4" />
            <circle cx="17.5" cy="6.5" r="0.6" fill="currentColor" stroke="none" />
          </svg>
        </a>
      </li>
      <li>
        
        <a href="https://www.linkedin.com/in/ishaan-sen-pandey/" target="_blank" rel="noopener" aria-label="LinkedIn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="3" />
            <path d="M8 10.5v6" />
            <circle cx="8" cy="7.5" r="0.6" fill="currentColor" stroke="none" />
            <path d="M12 16.5v-6" />
            <path d="M12 13.5a2.5 2.5 0 0 1 5 0v3" />
          </svg>
        </a>
      </li>
      <li>
        
        <a href="https://github.com/SpikyRobot" target="_blank" rel="noopener" aria-label="GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
            <path d="M9 18c-4.51 2-5-2-7-2" />
          </svg>
        </a>
      </li>
    </ul>
  </main>

  <footer>&copy; <span id="year"></span> Ishaan Sen Pandey</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Cursor-following highlight
    const root = document.documentElement;
    window.addEventListener('pointermove', (e) => {
      root.style.setProperty('--mx', e.clientX + 'px');
      root.style.setProperty('--my', e.clientY + 'px');
    });

    // Starfield: sparse, slowly drifting particles with a gentle twinkle
    // and a touch of parallax toward the cursor.
    (() => {
      const canvas = document.getElementById('stars');
      const ctx = canvas.getContext('2d');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let w, h, dpr, stars = [];
      let px = 0, py = 0, tx = 0, ty = 0;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = canvas.width = window.innerWidth * dpr;
        h = canvas.height = window.innerHeight * dpr;
        const count = Math.round((window.innerWidth * window.innerHeight) / 4500);
        stars = Array.from({ length: count }, () => {
          const depth = Math.random();
          return {
            x: Math.random() * w,
            y: Math.random() * h,
            r: (0.25 + depth * 0.9) * dpr,
            depth,
            base: 0.15 + depth * 0.65,
            phase: Math.random() * Math.PI * 2,
            speed: 0.4 + Math.random() * 1.2,
            vy: -(0.02 + depth * 0.08) * dpr,
          };
        });
      }

      window.addEventListener('pointermove', (e) => {
        tx = (e.clientX / window.innerWidth - 0.5) * 2;
        ty = (e.clientY / window.innerHeight - 0.5) * 2;
      });

      function frame(t) {
        ctx.clearRect(0, 0, w, h);
        px += (tx - px) * 0.03;
        py += (ty - py) * 0.03;
        const time = t / 1000;

        for (const s of stars) {
          if (!reduced) {
            s.y += s.vy;
            if (s.y < -5) { s.y = h + 5; s.x = Math.random() * w; }
          }
          const twinkle = reduced ? 1 : 0.65 + 0.35 * Math.sin(time * s.speed + s.phase);
          const x = s.x - px * s.depth * 14 * dpr;
          const y = s.y - py * s.depth * 14 * dpr;
          ctx.globalAlpha = s.base * twinkle;
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(x, y, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
        if (!reduced) requestAnimationFrame(frame);
      }

      resize();
      window.addEventListener('resize', () => { resize(); if (reduced) frame(0); });
      requestAnimationFrame(frame);
    })();

    // Wireframe sphere with orbit rings
    (() => {
      const c = document.getElementById('orb');
      const g = c.getContext('2d');
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let W, H, dpr, mx = -1e4, my = -1e4, K = 1;
      const TILT = -0.38;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = c.width = innerWidth * dpr;
        H = c.height = innerHeight * dpr;
      }
      addEventListener('resize', resize);
      addEventListener('pointermove', (e) => { mx = e.clientX * dpr; my = e.clientY * dpr; });

      function proj(x, y, z, rotY, R, cx, cy) {
        const cY = Math.cos(rotY), sY = Math.sin(rotY);
        const x1 = x * cY + z * sY;
        const z1 = -x * sY + z * cY;
        const cT = Math.cos(TILT), sT = Math.sin(TILT);
        const y2 = y * cT - z1 * sT;
        const z2 = y * sT + z1 * cT;
        return [cx + x1 * R, cy + y2 * R, z2];
      }

      function seg(a, b, base) {
        const midx = (a[0] + b[0]) / 2, midy = (a[1] + b[1]) / 2;
        const d = Math.hypot(midx - mx, midy - my);
        const boost = Math.max(0, 1 - d / (150 * dpr)) * 0.75;
        const front = (a[2] + b[2]) / 2 > 0 ? 1 : 0.3;
        g.globalAlpha = Math.min(1, (base * front + boost * front) * K);
        g.beginPath();
        g.moveTo(a[0], a[1]);
        g.lineTo(b[0], b[1]);
        g.stroke();
      }

      function draw(t) {
        g.clearRect(0, 0, W, H);
        const narrow = innerWidth < 760;
        K = narrow ? 0.5 : 1;
        const R = Math.min(W, H) * (narrow ? 0.36 : 0.33);
        const cx = W * (narrow ? 0.5 : 0.66), cy = H * 0.52;
        const rot = t * 0.00008;
        g.strokeStyle = '#fff';
        g.lineWidth = 1 * dpr;
        const D = Math.PI / 180;

        // latitudes
        for (let lat = -75; lat <= 75; lat += 15) {
          const y = -Math.sin(lat * D), r = Math.cos(lat * D);
          let prev = null;
          for (let lon = 0; lon <= 360; lon += 6) {
            const p = proj(r * Math.cos(lon * D), y, r * Math.sin(lon * D), rot, R, cx, cy);
            if (prev) seg(prev, p, 0.13);
            prev = p;
          }
        }
        // longitudes
        for (let lon = 0; lon < 180; lon += 15) {
          let prev = null;
          for (let lat = 0; lat <= 360; lat += 6) {
            const x = Math.cos(lat * D) * Math.cos(lon * D);
            const z = Math.cos(lat * D) * Math.sin(lon * D);
            const p = proj(x, Math.sin(lat * D), z, rot, R, cx, cy);
            if (prev) seg(prev, p, 0.13);
            prev = p;
          }
        }
        // orbit rings (fixed planes) with travelling points
        const rings = [
          { r: 1.42, tilt: 0.22, speed: 0.00022, phase: 0 },
          { r: 1.7, tilt: -0.12, speed: -0.00014, phase: 2.1 },
        ];
        for (const ring of rings) {
          const ct = Math.cos(ring.tilt), st = Math.sin(ring.tilt);
          const pt = (a) => {
            const x = ring.r * Math.cos(a), z = ring.r * Math.sin(a);
            return proj(x * ct, x * st, z, 0, R, cx, cy);
          };
          let prev = null;
          for (let a = 0; a <= Math.PI * 2 + 0.01; a += Math.PI / 90) {
            const p = pt(a);
            if (prev) seg(prev, p, 0.2);
            prev = p;
          }
          const m = pt(ring.phase + t * ring.speed);
          const vis = m[2] > 0 ? 1 : 0.35;
          const glow = g.createRadialGradient(m[0], m[1], 0, m[0], m[1], 10 * dpr);
          glow.addColorStop(0, 'rgba(255,255,255,0.9)');
          glow.addColorStop(1, 'rgba(255,255,255,0)');
          g.globalAlpha = vis * K;
          g.fillStyle = glow;
          g.beginPath();
          g.arc(m[0], m[1], 10 * dpr, 0, Math.PI * 2);
          g.fill();
        }
        g.globalAlpha = 1;
        if (!reduced) requestAnimationFrame(draw);
      }

      resize();
      requestAnimationFrame(draw);
    })();
  </script>
</body>
</html>
